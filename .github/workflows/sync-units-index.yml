name: Sync units index

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-units-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UNIT_API_URL: ${{ secrets.UNIT_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch structure from the restricted Apps Script
        if: env.UNIT_API_URL != ''
        run: |
          set -e
          curl -sfL --retry 3 --retry-delay 5 --max-time 60 "${UNIT_API_URL}?mode=index" -o assets/units-index.new.json

      - name: Validate JSON before replacing anything
        if: env.UNIT_API_URL != ''
        run: |
          python3 - <<'PY'
          import json, sys
          with open('assets/units-index.new.json', encoding='utf-8') as f:
              data = json.load(f)
          if not isinstance(data, list):
              sys.exit('Response was not a list')
          PY

      - name: Replace index only if changed
        id: diff
        if: env.UNIT_API_URL != ''
        run: |
          if [ -f assets/units-index.json ] && cmp -s assets/units-index.new.json assets/units-index.json; then
            rm assets/units-index.new.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv assets/units-index.new.json assets/units-index.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/units-index.json
          git commit -m "chore: sync units structure from Drive"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
