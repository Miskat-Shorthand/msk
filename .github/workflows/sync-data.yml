name: Sync MSK data

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-msk-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest data from Apps Script
        run: |
          set -e
          mkdir -p assets/data
          curl -sSfL --retry 3 --retry-delay 5 --max-time 90 \
            -H "Cache-Control: no-cache" \
            -w "HTTP %{http_code}, %{size_download} bytes\n" \
            "https://script.google.com/macros/s/AKfycbx56NY8Z9U_kw4E2F_6pjsWSmATgheLC43QgH1rHO7atFoWNg_pqyi5XwQEkKdgqQSt/exec?nocache=$(date +%s)" \
            -o assets/data/msk-data.new.json

      - name: Validate JSON and report what was fetched
        run: |
          python3 - <<'PY'
          import json, sys, os

          def summary(data):
              out = {}
              for name in ('Indonesian & Malay', 'Contributor'):
                  rows = (data.get(name) or {}).get('values') or []
                  out[name] = max(len(rows) - 1, 0)
              names = [str(r[1]) for r in ((data.get('Contributor') or {}).get('values') or [])[1:] if len(r) > 1]
              return out, names

          with open('assets/data/msk-data.new.json', encoding='utf-8') as f:
              new = json.load(f)
          if not isinstance(new, dict):
              sys.exit('Response was not an object: ' + str(new)[:300])
          for sheet in ('Indonesian & Malay', 'Contributor'):
              entry = new.get(sheet)
              if not isinstance(entry, dict) or not entry.get('values'):
                  sys.exit('Missing or empty sheet: ' + sheet + ' | keys=' + str(list(new.keys())))

          n_new, c_new = summary(new)
          print('FETCHED  rows:', n_new, '| contributors:', c_new)
          if os.path.exists('assets/data/msk-data.json'):
              with open('assets/data/msk-data.json', encoding='utf-8') as f:
                  n_old, c_old = summary(json.load(f))
              print('SNAPSHOT rows:', n_old, '| contributors:', c_old)
          PY
      
      - name: Replace snapshot only if changed
        id: diff
        run: |
          if [ -f assets/data/msk-data.json ] && cmp -s assets/data/msk-data.new.json assets/data/msk-data.json; then
            rm assets/data/msk-data.new.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv assets/data/msk-data.new.json assets/data/msk-data.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/msk-data.json
          git commit -m "chore: sync data from Google Sheet"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
